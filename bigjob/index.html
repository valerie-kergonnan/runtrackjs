<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - La Plateforme_</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles/main.css">
</head>

<body>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6 col-lg-5">
                <div class="card">
                    <div class="card-body text-center">
                        <!-- Logo -->
                        <img src="assets/images/La Plateforme.png" alt="La Plateforme_" class="logo">

                        <h2 class="mb-4">Connexion</h2>

                        <!-- Message d'erreur -->
                        <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

                        <!-- Formulaire de connexion -->
                        <form id="loginForm" novalidate>
                            <div class="mb-3 text-start">
                                <label for="email" class="form-label">
                                    <i class="bi bi-envelope"></i> Adresse email
                                </label>
                                <input type="email" class="form-control" id="email"
                                    placeholder="votre.email@laplateforme.io" required>
                                <div class="invalid-feedback">
                                    Veuillez saisir une adresse email valide.
                                </div>
                            </div>

                            <div class="mb-3 text-start">
                                <label for="password" class="form-label">
                                    <i class="bi bi-lock"></i> Mot de passe
                                </label>
                                <input type="password" class="form-control" id="password" placeholder="••••••••"
                                    required>
                                <div class="invalid-feedback">
                                    Veuillez saisir votre mot de passe.
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mb-3">
                                <i class="bi bi-box-arrow-in-right"></i> Se connecter
                            </button>
                        </form>

                        <hr>

                        <p class="mb-0">
                            Pas encore de compte ?
                            <a href="register.html">S'inscrire</a>
                        </p>

                        <!-- Aide -->
                        <div class="mt-4 text-muted small">
                            <p class="mb-1"><strong>Comptes de test :</strong></p>
                            <p class="mb-0">Admin : admin@laplateforme.io / admin</p>
                            <p class="mb-0">Modérateur : moderateur@laplateforme.io / modo</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Auth JS -->
    <script src="js/auth.js"></script>

    <script>
        // Attendre que le DOM et tous les scripts soient chargés
        window.addEventListener('DOMContentLoaded', function () {
            // Si l'utilisateur est déjà connecté, le rediriger
            const currentUser = localStorage.getItem("currentUser");
            if (currentUser) {
                const user = JSON.parse(currentUser);
                if (user.role === "admin") {
                    window.location.replace("admin.html");
                } else if (user.role === "moderator") {
                    window.location.replace("backoffice.html");
                } else {
                    window.location.replace("calendar.html");
                }
            }

            // Gestion du formulaire de connexion
            const loginForm = document.getElementById("loginForm");
            if (loginForm) {
                loginForm.addEventListener("submit", function (e) {
                    e.preventDefault();

                    // Validation Bootstrap
                    if (!this.checkValidity()) {
                        e.stopPropagation();
                        this.classList.add('was-validated');
                        return;
                    }

                    const email = document.getElementById("email").value;
                    const password = document.getElementById("password").value;

                    // Tentative de connexion
                    try {
                        const result = login(email, password);

                        if (result.success) {
                            // Redirection selon le rôle
                            if (result.user.role === "admin") {
                                window.location.replace("admin.html");
                            } else if (result.user.role === "moderator") {
                                window.location.replace("backoffice.html");
                            } else {
                                window.location.replace("calendar.html");
                            }
                        } else {
                            // Afficher l'erreur
                            const errorDiv = document.getElementById("errorMessage");
                            errorDiv.textContent = result.message;
                            errorDiv.classList.remove("d-none");

                            // Masquer l'erreur après 5 secondes
                            setTimeout(() => {
                                errorDiv.classList.add("d-none");
                            }, 5000);
                        }
                    } catch (error) {
                        console.error("Erreur lors de la connexion:", error);
                        const errorDiv = document.getElementById("errorMessage");
                        errorDiv.textContent = "Une erreur s'est produite. Vérifiez la console.";
                        errorDiv.classList.remove("d-none");
                    }
                });
            }
        });
    </script>
</body>

</html>
