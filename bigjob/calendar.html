<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier - La Plateforme_</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles/main.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="assets/images/La Plateforme.png" alt="La Plateforme_" height="40">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="calendar.html">
                            <i class="bi bi-calendar3"></i> Calendrier
                        </a>
                    </li>
                    <li class="nav-item" id="backofficeLink" style="display: none;">
                        <a class="nav-link" href="backoffice.html">
                            <i class="bi bi-kanban"></i> Backoffice
                        </a>
                    </li>
                    <li class="nav-item" id="adminLink" style="display: none;">
                        <a class="nav-link" href="admin.html">
                            <i class="bi bi-gear"></i> Administration
                        </a>
                    </li>
                    <li class="nav-item">
                        <span class="nav-link">
                            <i class="bi bi-person-circle"></i> <span id="userEmail"></span>
                        </span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="logout()">
                            <i class="bi bi-box-arrow-right"></i> Déconnexion
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenu principal -->
    <div class="container mt-4">
        <div class="row">
            <!-- Formulaire de demande -->
            <div class="col-lg-5 mb-4">
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-calendar-plus"></i> Nouvelle demande de présence
                    </div>
                    <div class="card-body">
                        <form id="presenceForm">
                            <div class="mb-3">
                                <label for="presenceDate" class="form-label">
                                    <i class="bi bi-calendar-event"></i> Date
                                </label>
                                <input type="date" class="form-control" id="presenceDate" required>
                                <div class="form-text">
                                    <i class="bi bi-info-circle"></i> Vous ne pouvez pas sélectionner une date passée
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="reason" class="form-label">
                                    <i class="bi bi-chat-left-text"></i> Motif (optionnel)
                                </label>
                                <textarea class="form-control" id="reason" rows="3"
                                    placeholder="Raison de votre présence..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-send"></i> Envoyer la demande
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Liste des demandes -->
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-list-check"></i> Mes demandes
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Statut</th>
                                        <th>Motif</th>
                                    </tr>
                                </thead>
                                <tbody id="myRequests">
                                    <tr>
                                        <td colspan="3" class="text-center">Chargement...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Auth JS -->
    <script src="js/auth.js"></script>
    <!-- Calendar JS -->
    <script src="js/calendar.js"></script>
</body>

</html>
